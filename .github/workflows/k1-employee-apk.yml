name: Build K1 Employee APK
on:
  push:
    branches: [k1-employee-apk-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: k1-employee-apk
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp k1-employee-apk/app/build/outputs/apk/debug/app-debug.apk K1_EMPLOYEE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: K1_EMPLOYEE_APK
          path: K1_EMPLOYEE.apk
          if-no-files-found: error
