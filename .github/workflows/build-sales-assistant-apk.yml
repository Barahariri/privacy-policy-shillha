name: Build Sales Assistant APK

on:
  push:
    branches:
      - temp-sales-assistant-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack app
        run: |
          rm -rf /tmp/salesassistant
          mkdir -p /tmp/salesassistant
          unzip -q sales-assistant/SalesAssistantAndroid-v1.zip -d /tmp/salesassistant

      - name: Build APK
        working-directory: /tmp/salesassistant/SalesAssistantAndroid
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesAssistant-APK
          path: /tmp/salesassistant/SalesAssistantAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
