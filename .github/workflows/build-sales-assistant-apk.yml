name: Build Sales Assistant APK

on:
  push:
    branches:
      - temp-sales-assistant-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Unpack app
        run: |
          rm -rf /tmp/salesassistant
          mkdir -p /tmp/salesassistant
          unzip -q sales-assistant/SalesAssistantAndroid-v1.zip -d /tmp/salesassistant

      - name: Build APK
        working-directory: /tmp/salesassistant/SalesAssistantAndroid
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesAssistant-APK
          path: /tmp/salesassistant/SalesAssistantAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
