name: Build K1 Employee V2 APK

on:
  push:
    branches:
      - k1-employee-v2-perfect
    paths:
      - 'k1-employee-v2/**'
      - '.github/workflows/k1-employee-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: k1-employee-v2
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK contains V2 resources
        run: |
          test -f k1-employee-v2/app/build/outputs/apk/debug/app-debug.apk
          unzip -l k1-employee-v2/app/build/outputs/apk/debug/app-debug.apk | grep -q resources.arsc
          cp k1-employee-v2/app/build/outputs/apk/debug/app-debug.apk K1_EMPLOYEE_V2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: K1_EMPLOYEE_V2_APK
          path: K1_EMPLOYEE_V2.apk
          if-no-files-found: error
