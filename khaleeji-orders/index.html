<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>الخليجي الأول - طلب جديد</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:system-ui,-apple-system,"Segoe UI",Arial;color:#171717}
.w{max-width:540px;margin:auto;padding:18px}.brand{text-align:center;font-size:26px;font-weight:950;margin:18px 0}
.card{background:#fff;border:1px solid #e7e7e7;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 5px 22px #0000000c}
.muted{color:#777}.center{text-align:center}.ok{background:#eefbf2;color:#166a31;padding:12px;border-radius:12px}.bad{background:#fff0f0;color:#a11;padding:12px;border-radius:12px}
button{width:100%;border:0;border-radius:13px;padding:14px;background:#111;color:#fff;font-weight:900;font-size:17px;margin-top:12px}.sec{background:#eee;color:#111}
.step{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.num{width:30px;height:30px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 auto}
</style>
</head><body><div class="w"><div class="brand">الخليجي الأول</div><div id="app"></div></div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
const qs=new URLSearchParams(location.search);
if(qs.get('api')) localStorage.setItem('gasApi',qs.get('api'));
if(qs.get('emp')) localStorage.setItem('empToken',qs.get('emp'));
const api=localStorage.getItem('gasApi')||'', emp=localStorage.getItem('empToken')||'';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(16).slice(2);window[cb]=d=>{delete window[cb];s.remove();resolve(d)};const s=document.createElement('script');s.onerror=()=>{delete window[cb];s.remove();reject(new Error('تعذر الاتصال بالنظام'))};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s)})}
async function boot(){
  if(!api||!emp){app.innerHTML='<div class="card bad"><b>هذا الرابط غير مفعّل.</b><br>افتح رابط التفعيل الذي ينسخه المدير من صفحة الموظفين.</div>';return}
  app.innerHTML='<div class="card center">جاري التحقق من التفعيل...</div>';
  try{
    const r=await jsonp(api+'?api=employeeInfo&emp='+encodeURIComponent(emp));
    if(!r.ok) throw new Error(r.error);
    app.innerHTML=`<div class="card center"><div class="muted">الموظف</div><h2>${esc(r.employee.name)}</h2><div class="ok">✅ الجهاز مفعّل وجاهز</div></div>
    <div class="card"><h3>الاستخدام اليومي</h3>
      <div class="step"><div class="num">1</div><div>في WhatsApp Business اضغط مطولاً على <b>رسالة عنوان الزبونة</b>.</div></div>
      <div class="step"><div class="num">2</div><div>اختر <b>مشاركة</b>.</div></div>
      <div class="step"><div class="num">3</div><div>اختر <b>الخليجي الأول - طلب جديد</b>.</div></div>
      <div class="step"><div class="num">4</div><div>اضغط <b>إنشاء الطلب</b> وسيظهر الرقم فوراً لتكتبه على القطع.</div></div>
      <p class="muted">لا تحتاج نسخ رابط أو إدخال رمز مرة ثانية على هذا الهاتف.</p>
    </div>`;
  }catch(e){app.innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}
}
boot();
</script></body></html>
